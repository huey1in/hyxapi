# PostgreSQL + Redis deployment. For SQLite, use deploy/compose.yml instead.
# Keep the legacy service/database/volume identifiers for existing installations.
# Set SESSION_SECRET, POSTGRES_PASSWORD and REDIS_PASSWORD in .env before starting.
services:
  new-api:
    image: ${HYXAPI_IMAGE:-ghcr.io/huey1in/hyxapi:latest}
    container_name: new-api
    restart: unless-stopped
    command: ['--log-dir', '/app/logs']
    ports:
      - '${HYXAPI_BIND_ADDRESS:-127.0.0.1}:${HYXAPI_PORT:-3000}:3000'
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    env_file: .env
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set a persistent random SESSION_SECRET in .env}
      SQL_DSN: postgresql://root:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      BIND_ADDRESS: 0.0.0.0
      PORT: '3000'
      TZ: ${TZ:-UTC}
      ERROR_LOG_ENABLED: 'true'
      BATCH_UPDATE_ENABLED: 'true'
      NODE_NAME: ${NODE_NAME:-hyxapi-1}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/api/status | grep -Eq ''"success"[[:space:]]*:[[:space:]]*true''']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - new-api-network

volumes:
  pg_data:

networks:
  new-api-network:
    driver: bridge
