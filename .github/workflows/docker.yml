name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/docker.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - '**/*.go'
      - '**/go.mod'
      - '**/go.sum'
      - 'web/**'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Image name and application version
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)+sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=HyxAPI
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=${{ steps.image.outputs.version }}

      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: hyxapi:smoke
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify service startup and web routes
        shell: bash
        run: |
          docker run --detach --name hyxapi-smoke \
            --publish 127.0.0.1:3000:3000 \
            --env SESSION_SECRET="$(openssl rand -hex 32)" \
            hyxapi:smoke
          curl --fail --silent --show-error --connect-timeout 2 --max-time 5 --retry 30 --retry-delay 2 \
            --retry-all-errors http://127.0.0.1:3000/api/status > /tmp/hyxapi-status.json
          python3 -c 'import json; assert json.load(open("/tmp/hyxapi-status.json"))["success"] is True'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 302
          curl --fail --silent http://127.0.0.1:3000/console > /dev/null
          curl --fail --silent http://127.0.0.1:3000/pricing > /dev/null

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish AMD64 and ARM64 images
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show startup logs on failure
        if: failure()
        run: docker logs hyxapi-smoke || true

      - name: Clean up smoke test
        if: always()
        run: docker rm --force hyxapi-smoke || true
