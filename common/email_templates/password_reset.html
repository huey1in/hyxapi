<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>{{siteName}} · 密码重置</title>
    <style>
      /* Core layout and colors are inline so the email also works without this stylesheet. */
      table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
      a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
      @media screen and (max-width: 600px) {
        .email-outer { padding: 36px 20px !important; }
        .email-heading { font-size: 26px !important; line-height: 36px !important; }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; width: 100%; background-color: #ffffff; color: #080808; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
    <!-- Supported template variables: {{siteName}}, {{resetLink}}, {{expireMinutes}}. -->
    <div aria-hidden="true" style="display: none; max-height: 0; max-width: 0; overflow: hidden; opacity: 0; color: #ffffff; font-size: 1px; line-height: 1px; mso-hide: all;">
      {{siteName}} 密码重置，请在 {{expireMinutes}} 分钟内完成操作。
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width: 100%; border-collapse: collapse; background-color: #ffffff;">
      <tr>
        <td class="email-outer" align="center" style="padding: 64px 24px;">
          <!--[if mso]>
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0"><tr><td>
          <![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 560px; border-collapse: collapse; table-layout: fixed;">
            <tr>
              <td style="padding: 0 0 28px; text-align: left;">
                <p style="margin: 0; color: #080808; font-size: 28px; font-weight: 700; line-height: 36px; letter-spacing: -0.6px; overflow-wrap: break-word;">{{siteName}}</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 36px 0 28px; border-top: 1px solid #eeeeee; text-align: left;">
                <h1 class="email-heading" style="margin: 0 0 12px; color: #080808; font-size: 28px; font-weight: 600; line-height: 38px; letter-spacing: -0.5px;">重置您的密码</h1>
                <p style="margin: 0; color: #666666; font-size: 15px; line-height: 26px;">我们收到了您的密码重置请求。若是您本人操作，请点击下方按钮继续。</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f6f8" style="width: 100%; border-collapse: separate; border-spacing: 0; border-radius: 10px; background-color: #f3f6f8; background-image: linear-gradient(115deg, #eef4ff 0%, #eef7f5 100%);">
                  <tr>
                    <td align="center" style="padding: 28px 16px; text-align: center;">
                      <!--[if mso]>
                      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{resetLink}}" style="height: 46px; v-text-anchor: middle; width: 176px;" arcsize="13%" stroke="f" fillcolor="#222222">
                        <w:anchorlock />
                        <center style="color: #ffffff; font-family: 'Microsoft YaHei', Arial, sans-serif; font-size: 14px; font-weight: 500;">重置密码</center>
                      </v:roundrect>
                      <![endif]-->
                      <!--[if !mso]><!-->
                      <a href="{{resetLink}}" target="_blank" rel="noopener noreferrer" style="display: inline-block; width: 176px; padding: 13px 0; border-radius: 6px; background-color: #222222; color: #ffffff; font-size: 14px; font-weight: 500; line-height: 20px; text-align: center; text-decoration: none; mso-hide: all;">重置密码</a>
                      <!--<![endif]-->
                      <p style="margin: 16px 0 0; color: #666666; font-size: 12px; line-height: 20px;">链接将在 <strong style="color: #222222; font-weight: 600;">{{expireMinutes}} 分钟</strong>后失效</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0 0; text-align: left;">
                <p style="margin: 0 0 10px; color: #666666; font-size: 13px; line-height: 24px;">如果按钮无法点击，请复制以下链接到浏览器打开：</p>
                <p style="margin: 0; font-size: 12px; line-height: 22px; word-break: break-all; overflow-wrap: anywhere;">
                  <a href="{{resetLink}}" target="_blank" rel="noopener noreferrer" dir="ltr" style="color: #666666; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12px; line-height: 22px; text-decoration: underline; word-break: break-all; overflow-wrap: anywhere;">{{resetLink}}</a>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0 32px; text-align: left;">
                <p style="margin: 0; color: #666666; font-size: 13px; line-height: 24px;">此链接仅用于本次密码重置，请勿向他人转发。<br />如果这不是您本人的操作，请忽略此邮件。</p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px 0 0; border-top: 1px solid #eeeeee; text-align: left;">
                <p style="margin: 0; color: #767676; font-size: 12px; line-height: 22px;">此邮件由 {{siteName}} 自动发送，请勿直接回复。</p>
              </td>
            </tr>
          </table>
          <!--[if mso]>
          </td></tr></table>
          <![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
